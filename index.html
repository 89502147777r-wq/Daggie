<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0720">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" href="icon-512.png">
<title>Crash Test Daggie</title>
<!-- const BUILD = '3.0' (kept for devices that still run version 2.x, so they see the update button) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--deep:#0b0720;--ink:#efeaff;--dim:#a79cd6;--yellow:#ffc41f;--green:#3dff9a;--line:rgba(170,120,255,.32);--panel:rgba(20,14,48,.8);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--deep:#0b0720;--ink:#efeaff}}
:root[data-theme="dark"]{--deep:#0b0720;--ink:#efeaff}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--deep);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:radial-gradient(120% 60% at 50% 0%,#2a1464 0%,var(--deep) 60%);color:var(--ink);font-family:"Chakra Petch",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{max-width:560px;margin:0 auto;padding:18px 16px 28px;position:relative}
header{display:flex;align-items:center;gap:14px;margin:6px 0 22px}
header img{width:64px;height:64px;border-radius:16px;box-shadow:0 0 24px rgba(255,196,31,.35);flex:none}
h1{margin:0;font-size:clamp(26px,8vw,36px);line-height:1;letter-spacing:.5px}
h1 b{color:var(--yellow)}
header small{color:var(--dim);font-size:13px}
.mode{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:16px}
.mode h2{margin:0;font-size:24px;color:var(--yellow);letter-spacing:1px}
.mode p{margin:2px 0 12px;color:var(--dim);font-size:13px}
.lv{appearance:none;-webkit-appearance:none;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);border-radius:14px;padding:13px 14px;margin-top:8px;font:inherit;cursor:pointer}
.lv b{font-size:17px;display:block}
.lv small{color:var(--dim);font-size:12px}
.lv .go{flex:none;background:var(--yellow);color:#16112a;font-weight:700;border-radius:10px;padding:8px 14px;font-size:15px}
.lv:disabled{opacity:.5;cursor:default}
.lv:disabled .go{background:transparent;color:var(--dim);border:1px dashed var(--line)}
.lv:not(:disabled):active{transform:scale(.98)}
button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.updbtn{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9;border:0;border-radius:12px;background:var(--green);color:#0b0720;font:700 14px "Chakra Petch",ui-sans-serif,sans-serif;padding:12px 16px;box-shadow:0 6px 24px rgba(61,255,154,.4);max-width:calc(100% - 32px)}
</style>
</head>
<body>
<div id="stage">
  <header><img src="icon-512.png" alt=""><div><h1>Crash Test <b>Daggie</b></h1><small>Pick a mode and a level</small></div></header>
  <main id="modes"></main>
</div>
<script type="module">
import { MODES } from './levels.js';
const root = document.getElementById('modes');
for (const m of MODES) {
  const sec = document.createElement('section'); sec.className = 'mode';
  const h = document.createElement('h2'); h.textContent = m.title;
  const p = document.createElement('p'); p.textContent = m.sub;
  sec.append(h, p);
  for (const l of m.levels) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'lv'; b.disabled = !l.ready;
    const info = document.createElement('div'); const t = document.createElement('b'); t.textContent = l.name; const s = document.createElement('small'); s.textContent = l.ride; info.append(t, s);
    const go = document.createElement('span'); go.className = 'go'; go.textContent = l.ready ? 'PLAY' : 'SOON';
    b.append(info, go);
    if (l.ready) b.onclick = () => { location.href = m.page + '?level=' + encodeURIComponent(l.id); };
    sec.appendChild(b);
  }
  root.appendChild(sec);
}
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(r => r.update()).catch(() => {});</script>
<script src="update.js"></script>
</body>
</html>
